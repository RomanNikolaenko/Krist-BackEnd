# Local dependencies. Production runs managed services; this is for development
# and for the integration tests.
services:
  postgres:
    image: postgres:17-alpine
    container_name: krist-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: krist
      POSTGRES_PASSWORD: krist
      POSTGRES_DB: krist
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U krist -d krist']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: krist-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'no']
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
